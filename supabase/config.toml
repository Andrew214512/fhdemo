# Supabase CLI settings for Worm. Everything not listed uses Supabase's defaults.
project_id = "worm"

# Webhooks are called by Stripe and EasyPost, not by a signed-in reader, so they
# skip Supabase's sign-in check and verify the sender's signature themselves.
[functions.stripe-webhook]
verify_jwt = false

[functions.tracking-webhook]
verify_jwt = false
